[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "library-contents-claim"
version = "0.1.0"
description = "Evidence-backed library claim packet contracts and deterministic export"
requires-python = ">=3.12"
dependencies = ["pydantic==2.14.0", "Pillow==12.3.0", "fastapi==0.141.1", "uvicorn==0.54.0"]

[tool.setuptools.packages.find]
include = ["library_claim*"]

[tool.setuptools.package-data]
library_claim = ["web/*"]
