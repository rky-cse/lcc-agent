<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physical registration review</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><main><h1>Physical registration review</h1><p><a href="/recognition">Recognition queue</a></p>
<p>Compare the saved original and numbered polygons. Decide each candidate separately. A matching title does not establish the same physical copy. Revisited copies need an explicit existing track; ambiguous copies can stay unresolved.</p>
<button id="registration-refresh">Refresh review</button><p id="registration-status" role="status" aria-live="polite">Loading review…</p>
<div id="registration-original"></div><p id="registration-pins"></p><div id="registration-warnings"></div>
<form id="registration-form"><div id="registration-decisions"></div><label>Reviewer <input id="registration-reviewer" required maxlength="200"></label>
<label>Overall review reason <input id="registration-reason" required maxlength="1000"></label><button id="registration-apply" disabled>Apply reviewed registration</button></form>
<div id="registration-receipts"></div></main><script type="module" src="/assets/registration_page.mjs"></script></body></html>
